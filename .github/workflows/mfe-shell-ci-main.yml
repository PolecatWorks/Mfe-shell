name: MFE Shell CI (Main)

on:
  push:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-mfe-shell

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-paths:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'mfe-shell-container/**'
              - '.github/workflows/mfe-shell-ci-pr.yml'
              - '.github/workflows/mfe-shell-ci-main.yml'

  check-image:
    needs: check-paths
    if: needs.check-paths.outputs.backend == 'true'
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
      shell_sha: ${{ steps.shell-content.outputs.SHELL_SHA }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Shell Content SHA
        id: shell-content
        run: |
          SHELL_SHA=$(git log -1 --format=%H -- mfe-shell-container/ .github/workflows/mfe-shell-ci-main.yml)
          echo "SHELL_SHA=$SHELL_SHA" >> $GITHUB_OUTPUT

      - name: Determine Image Name
        id: image-name
        run: |
          repo_name="${{ github.repository }}"
          echo "IMAGE_NAME_LOWERCASE=$(echo "$repo_name" | tr '[:upper:]' '[:lower:]')-mfe-shell" >> $GITHUB_OUTPUT

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if image exists
        id: check
        run: |
          IMAGE_REF="${{ env.REGISTRY }}/${{ steps.image-name.outputs.IMAGE_NAME_LOWERCASE }}:sha-${{ steps.shell-content.outputs.SHELL_SHA }}"
          echo "Checking if image exists: $IMAGE_REF"
          if docker manifest inspect $IMAGE_REF >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Image exists in registry!"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Image does not exist in registry."
          fi

  build:
    needs: [check-paths, check-image]
    if: needs.check-paths.outputs.backend == 'true' && needs.check-image.outputs.exists != 'true'
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64

    runs-on: ${{ matrix.platform == 'linux/amd64' && 'ubuntu-24.04' || matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' }}
    name: ${{ matrix.platform }} MFE Shell Docker
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Shell Content SHA
        id: shell-content
        run: |
          SHELL_SHA=$(git log -1 --format=%H -- mfe-shell-container/ .github/workflows/mfe-shell-ci-main.yml)
          echo "Determined shell content SHA: $SHELL_SHA"
          echo "SHELL_SHA=$SHELL_SHA" >> $GITHUB_ENV

      - name: Prepare environment
        id: prepare
        run: |
          platform=${{ matrix.platform }}
          repo_name="${{ github.repository }}"
          echo "IMAGE_NAME_LOWERCASE=$(echo "$repo_name" | tr '[:upper:]' '[:lower:]')-mfe-shell" >> $GITHUB_ENV
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: ${{ matrix.platform }}

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=main
            type=raw,value=latest
            type=raw,value=sha-${{ env.SHELL_SHA }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: mfe-shell-container
          secrets: |
            NODE_AUTH_TOKEN=${{ secrets.GITHUB_TOKEN }}
          load: true
          tags: ${{ env.IMAGE_NAME_LOWERCASE }}:local-test
          cache-from: |
            type=gha,scope=${{ github.repository }}-mfe-shell-${{ github.ref_name }}-${{ matrix.platform }}
            type=gha,scope=${{ github.repository }}-mfe-shell-main-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ github.repository }}-mfe-shell-${{ github.ref_name }}-${{ matrix.platform }}

      - name: Container Smoke Verification
        run: |
          echo "Starting container smoke test for ${{ matrix.platform }}..."
          CONTAINER_ID=$(docker run -d -p 8080:8080 ${{ env.IMAGE_NAME_LOWERCASE }}:local-test)
          sleep 3

          echo "Checking container logs..."
          docker logs $CONTAINER_ID

          echo "Probing container HTTP endpoint /index.html..."
          for i in {1..10}; do
            if curl -s -f http://127.0.0.1:8080/index.html > /dev/null; then
              echo "Root /index.html is reachable!"
              break
            fi
            echo "Waiting for container to serve /index.html... ($i/10)"
            sleep 2
          done

          # Verify CORS headers on options /
          echo "Verifying HTTP response..."
          curl -I http://127.0.0.1:8080/index.html | grep -i "content-type"

          docker stop $CONTAINER_ID
          docker rm $CONTAINER_ID

      - name: Push Docker image by digest
        id: push-digest
        uses: docker/build-push-action@v7
        with:
          context: mfe-shell-container
          secrets: |
            NODE_AUTH_TOKEN=${{ secrets.GITHUB_TOKEN }}
          push: true
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWERCASE }},push-by-digest=true,name-canonical=true,push=true,oci-mediatypes=true
          cache-from: |
            type=gha,scope=${{ github.repository }}-mfe-shell-${{ github.ref_name }}-${{ matrix.platform }}
            type=gha,scope=${{ github.repository }}-mfe-shell-main-${{ matrix.platform }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.push-digest.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v5
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge Docker manifests
    runs-on: ubuntu-latest
    needs: [check-paths, check-image, build]
    if: always() && needs.check-paths.outputs.backend == 'true' && (needs.build.result == 'success' || needs.check-image.outputs.exists == 'true')
    permissions:
      packages: write
      contents: read
    steps:
      - name: Prepare environment
        run: |
          repo_name="${{ github.repository }}"
          echo "IMAGE_NAME_LOWERCASE=$(echo "$repo_name" | tr '[:upper:]' '[:lower:]')-mfe-shell" >> $GITHUB_ENV

      - name: Checkout repository (for history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Shell Content SHA
        id: shell-content
        run: |
          SHELL_SHA=$(git log -1 --format=%H -- mfe-shell-container/ .github/workflows/mfe-shell-ci-main.yml)
          echo "SHELL_SHA=$SHELL_SHA" >> $GITHUB_ENV

      - name: Download digests
        if: needs.build.result == 'success'
        uses: actions/download-artifact@v6
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWERCASE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=main
            type=raw,value=latest
            type=raw,value=sha-${{ env.SHELL_SHA }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        if: needs.build.result == 'success'
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWERCASE }}@sha256:%s ' *)

      - name: Apply tags to existing image
        if: needs.build.result != 'success'
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWERCASE }}:sha-${{ env.SHELL_SHA }}

      - name: Inspect image
        run: |
          docker buildx imagetools inspect '${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWERCASE }}:${{ steps.meta.outputs.version }}'

  ci-success:
    name: MFE Shell CI Success
    needs: [check-paths, check-image, merge]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check Status
        run: |
          if [[ "${{ needs.check-paths.outputs.backend }}" == 'true' ]]; then
            if [[ "${{ needs.check-image.outputs.exists }}" != 'true' && "${{ needs.merge.result }}" != 'success' ]]; then
               echo "Build/Merge failed!"
               exit 1
            fi
          fi
          echo "Success!"

name: MFE1 CI (Main)

on:
  push:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-mfe1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-paths:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'mfe1-container/**'
              - '.github/workflows/mfe1-ci-pr.yml'
              - '.github/workflows/mfe1-ci-main.yml'
            shared:
              - 'mfe-shell-container/projects/mfe-shared/**'

  wait-for-shared:
    needs: check-paths
    if: needs.check-paths.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Determine Shared Dependency SHA
        id: shared-dep
        if: needs.check-paths.outputs.shared == 'true'
        run: |
          echo "Shared changes detected in Main push. Waiting for workflow on SHA: $GITHUB_SHA"
          echo "WORKFLOW_SHA=$GITHUB_SHA" >> $GITHUB_ENV

      - name: Wait for MFE Shared Workflow
        if: needs.check-paths.outputs.shared == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const workflowId = 'mfe-shared-ci-main.yml';
            const maxRetries = 60; // Wait up to 30 minutes (30s interval)
            const intervalSeconds = 30;
            const commitSha = process.env.WORKFLOW_SHA;

            console.log(`Waiting for workflow ${workflowId} on commit ${commitSha}...`);

            for (let i = 0; i < maxRetries; i++) {
              try {
                const runs = await github.rest.actions.listWorkflowRuns({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: workflowId,
                  head_sha: commitSha,
                });

                if (runs.data.total_count === 0) {
                  console.log('Workflow run not found yet. Waiting...');
                } else {
                  const run = runs.data.workflow_runs[0];
                  console.log(`Found workflow run: ${run.id} (Status: ${run.status}, Conclusion: ${run.conclusion})`);

                  if (run.status === 'completed') {
                    if (run.conclusion === 'success') {
                      console.log('MFE Shared workflow completed successfully.');
                      return;
                    } else {
                      core.setFailed(`MFE Shared workflow failed with conclusion: ${run.conclusion}`);
                      return;
                    }
                  }
                }
              } catch (error) {
                console.log(`Error checking workflow status: ${error.message}. Retrying...`);
              }
              await new Promise(r => setTimeout(r, intervalSeconds * 1000));
            }
            core.setFailed('Timeout waiting for MFE Shared workflow to complete.');

  check-image:
    needs: [check-paths, wait-for-shared]
    if: needs.check-paths.outputs.backend == 'true'
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
      content_sha: ${{ steps.mfe1-content.outputs.CONTENT_SHA }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine MFE1 Content SHA
        id: mfe1-content
        run: |
          CONTENT_SHA=$(git log -1 --format=%H -- mfe1-container/ .github/workflows/mfe1-ci-main.yml)
          echo "CONTENT_SHA=$CONTENT_SHA" >> $GITHUB_OUTPUT

      - name: Determine Image Name
        id: image-name
        run: |
          repo_name="${{ github.repository }}"
          echo "IMAGE_NAME_LOWERCASE=$(echo "$repo_name" | tr '[:upper:]' '[:lower:]')-mfe1" >> $GITHUB_OUTPUT

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if image exists
        id: check
        run: |
          IMAGE_REF="${{ env.REGISTRY }}/${{ steps.image-name.outputs.IMAGE_NAME_LOWERCASE }}:sha-${{ steps.mfe1-content.outputs.CONTENT_SHA }}"
          echo "Checking if image exists: $IMAGE_REF"
          if docker manifest inspect $IMAGE_REF >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Image exists in registry!"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Image does not exist in registry."
          fi

  build:
    needs: [check-paths, wait-for-shared, check-image]
    if: needs.check-paths.outputs.backend == 'true' && needs.check-image.outputs.exists != 'true'
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64

    runs-on: ${{ matrix.platform == 'linux/amd64' && 'ubuntu-24.04' || matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' }}
    name: ${{ matrix.platform }} MFE1 Docker
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare environment
        id: prepare
        run: |
          platform=${{ matrix.platform }}
          repo_name="${{ github.repository }}"

          # For Main, strictly use prod image path
          echo "IMAGE_NAME_LOWERCASE=$(echo "$repo_name" | tr '[:upper:]' '[:lower:]')-mfe1" >> $GITHUB_ENV

          # Calculate Content SHA for tagging
          CONTENT_SHA=$(git log -1 --format=%H -- mfe1-container/ .github/workflows/mfe1-ci-main.yml)
          echo "CONTENT_SHA=$CONTENT_SHA" >> $GITHUB_ENV
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: ${{ matrix.platform }}

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWERCASE }}
          tags: |
            type=raw,value=main
            type=raw,value=latest
            type=raw,value=sha-${{ env.CONTENT_SHA }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: mfe1-container
          secrets: |
            NODE_AUTH_TOKEN=${{ secrets.GITHUB_TOKEN }}
          load: true
          tags: ${{ env.IMAGE_NAME_LOWERCASE }}:local-test
          build-args: |
            MFE_SHARED_VERSION=latest
          cache-from: |
            type=gha,scope=${{ github.repository }}-mfe1-${{ github.ref_name }}-${{ matrix.platform }}
            type=gha,scope=${{ github.repository }}-mfe1-main-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ github.repository }}-mfe1-${{ github.ref_name }}-${{ matrix.platform }}

      - name: Container Smoke Verification
        run: |
          echo "Starting container smoke test for MFE1 on ${{ matrix.platform }}..."
          CONTAINER_ID=$(docker run -d -p 8081:8080 ${{ env.IMAGE_NAME_LOWERCASE }}:local-test)
          sleep 3

          echo "Checking container logs..."
          docker logs $CONTAINER_ID

          echo "Probing container HTTP endpoint /remoteEntry.json..."
          for i in {1..10}; do
            if curl -s -f http://127.0.0.1:8081/remoteEntry.json > /dev/null; then
              echo "MFE1 remoteEntry.json is reachable!"
              break
            fi
            echo "Waiting for container to serve remoteEntry.json... ($i/10)"
            sleep 2
          done

          echo "Verifying HTTP response..."
          curl -I http://127.0.0.1:8081/remoteEntry.json | grep -i "content-type"

          docker stop $CONTAINER_ID
          docker rm $CONTAINER_ID

      - name: Push Docker image by digest
        id: push-digest
        uses: docker/build-push-action@v7
        with:
          context: mfe1-container
          secrets: |
            NODE_AUTH_TOKEN=${{ secrets.GITHUB_TOKEN }}
          push: true
          build-args: |
            MFE_SHARED_VERSION=latest
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWERCASE }},push-by-digest=true,name-canonical=true,push=true,oci-mediatypes=true
          cache-from: |
            type=gha,scope=${{ github.repository }}-mfe1-${{ github.ref_name }}-${{ matrix.platform }}
            type=gha,scope=${{ github.repository }}-mfe1-main-${{ matrix.platform }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.push-digest.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v5
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge Docker manifests
    runs-on: ubuntu-latest
    needs: [check-paths, check-image, build]
    if: always() && needs.check-paths.outputs.backend == 'true' && (needs.build.result == 'success' || needs.check-image.outputs.exists == 'true')
    permissions:
      packages: write
      contents: read
    steps:
      - name: Prepare environment
        run: |
          repo_name="${{ github.repository }}"
          echo "IMAGE_NAME_LOWERCASE=$(echo "$repo_name" | tr '[:upper:]' '[:lower:]')-mfe1" >> $GITHUB_ENV

      - name: Determine MFE1 Content SHA
        id: mfe1-content
        run: |
          CONTENT_SHA=$(git log -1 --format=%H -- mfe1-container/ .github/workflows/mfe1-ci-main.yml)
          echo "CONTENT_SHA=$CONTENT_SHA" >> $GITHUB_ENV

      - name: Download digests
        if: needs.build.result == 'success'
        uses: actions/download-artifact@v6
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWERCASE }}
          tags: |
            type=raw,value=main
            type=raw,value=latest
            type=raw,value=sha-${{ env.CONTENT_SHA }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        if: needs.build.result == 'success'
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWERCASE }}@sha256:%s ' *)

      - name: Apply tags to existing image
        if: needs.build.result != 'success'
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWERCASE }}:sha-${{ env.CONTENT_SHA }}

      - name: Inspect image
        run: |
          docker buildx imagetools inspect '${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWERCASE }}:${{ steps.meta.outputs.version }}'

  ci-success:
    name: MFE1 CI Success
    needs: [check-paths, check-image, merge]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check Status
        run: |
          if [[ "${{ needs.check-paths.outputs.backend }}" == 'true' ]]; then
            if [[ "${{ needs.check-image.outputs.exists }}" != 'true' && "${{ needs.merge.result }}" != 'success' ]]; then
               echo "Build/Merge failed!"
               exit 1
            fi
          fi
          echo "Success!"

---
apiVersion: v1.edp.epam.com/v1
kind: KeycloakClient
metadata:
  name: angry-agent
spec:
  realmRef:
    name: dev
    kind: KeycloakRealm
  advancedProtocolMappers: true
  clientId: angry-agent
  name: Angry Agent
  description: Service Account to describe the angry agent application
  clientRoles:
    - service-read
    - service-write
    - service-delete
---
apiVersion: v1.edp.epam.com/v1
kind: KeycloakRealmGroup
metadata:
  name: angry-agent-readers
spec:
  realmRef:
    name: dev
    kind: KeycloakRealm
  name: AngryAgentReaders
  clientRoles:
    - clientId: angry-agent
      roles:
        - service-read
---
apiVersion: v1.edp.epam.com/v1
kind: KeycloakRealmGroup
metadata:
  name: angry-agent-writers
spec:
  realmRef:
    name: dev
    kind: KeycloakRealm
  name: AngryAgentWriters
  clientRoles:
    - clientId: angry-agent
      roles:
        - service-write
        - service-delete
---
apiVersion: v1.edp.epam.com/v1
kind: KeycloakRealmGroup
metadata:
  name: data-agent-admins
spec:
  realmRef:
    name: dev
    kind: KeycloakRealm
  name: DataAgentAdmins
  clientRoles:
    - clientId: angry-agent-api
      roles:
        - "agent:execute"
        - "agent:create"
        - "agent:admin"
    - clientId: graphrag-api
      roles:
        - "graph:read"
        - "graph:write"
        - "graph:admin"
    - clientId: data-engine-api
      roles:
        - "profile:run"
        - "query:run"
        - "compute:execute"
        - "dataset:admin"
    - clientId: agent-as-data-api
      roles:
        - "agent:read"
        - "agent:author"
        - "agent:publish"
        - "governance:admin"
---
apiVersion: v1.edp.epam.com/v1
kind: KeycloakRealmGroup
metadata:
  name: data-agent-users
spec:
  realmRef:
    name: dev
    kind: KeycloakRealm
  name: DataAgentUsers
  clientRoles:
    - clientId: angry-agent-api
      roles:
        - "agent:execute"
        - "agent:create"
    - clientId: graphrag-api
      roles:
        - "graph:read"
        - "graph:write"
    - clientId: data-engine-api
      roles:
        - "profile:run"
        - "query:run"
        - "compute:execute"
    - clientId: agent-as-data-api
      roles:
        - "agent:read"
        - "agent:author"

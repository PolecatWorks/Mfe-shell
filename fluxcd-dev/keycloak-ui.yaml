---
apiVersion: v1.edp.epam.com/v1
kind: KeycloakClientScope
metadata:
  name: ecosystem-audiences
spec:
  name: ecosystem-audiences
  realmRef:
    name: dev
    kind: KeycloakRealm
  description: Maps audience claims for ecosystem microservices
  protocol: openid-connect
  protocolMappers:
    - name: angry-agent-audience
      protocol: openid-connect
      protocolMapper: oidc-audience-mapper
      config:
        "included.client.audience": "angry-agent-api"
        "id.token.claim": "false"
        "access.token.claim": "true"
        "introspection.token.claim": "true"
    - name: graphrag-audience
      protocol: openid-connect
      protocolMapper: oidc-audience-mapper
      config:
        "included.client.audience": "graphrag-api"
        "id.token.claim": "false"
        "access.token.claim": "true"
        "introspection.token.claim": "true"
    - name: data-engine-audience
      protocol: openid-connect
      protocolMapper: oidc-audience-mapper
      config:
        "included.client.audience": "data-engine-api"
        "id.token.claim": "false"
        "access.token.claim": "true"
        "introspection.token.claim": "true"
    - name: agent-as-data-audience
      protocol: openid-connect
      protocolMapper: oidc-audience-mapper
      config:
        "included.client.audience": "agent-as-data-api"
        "id.token.claim": "false"
        "access.token.claim": "true"
        "introspection.token.claim": "true"
---
apiVersion: v1.edp.epam.com/v1
kind: KeycloakClient
metadata:
  name: shell-ui
spec:
  realmRef:
    name: dev
    kind: KeycloakRealm
  advancedProtocolMappers: true
  clientId: shell-ui
  name: Shell UI OAuth Client
  description: Public client for PolecatWorks AI Portal / MFE Shell
  public: true
  standardFlowEnabled: true
  pkceCodeChallengeMethod: "S256"
  defaultClientScopes:
    - web-origins
    - role_list
    - profile
    - roles
    - email
    - ecosystem-audiences
  redirectUris:
    - "https://ai.dev.polecatworks.com/*"
    - "http://localhost:4200/*"
    - "http://localhost:8080/*"
  webOrigins:
    - "+"

---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: mfe-shell
spec:
  hosts:
    - aad.k8s
    - agent-as-data.k8s
    - ai.k8s
  gateways:
    - istio-ingress/k8s-gateway
    - mesh # applies to all the sidecars in the mesh
  http:
    - name: mfe1
      match:
        - uri:
            prefix: /mfe/mfe1
      route:
        - destination:
            host: mfe1-nginx-view
    - name: mfe2
      match:
        - uri:
            prefix: /mfe/mfe2
      route:
        - destination:
            host: mfe2-nginx-view
    - name: angry-agent
      match:
        - uri:
            prefix: /mfe/angry-agent
      route:
        - destination:
            host: mfe-angry-agent-nginx-view
    - name: aad
      match:
        - uri:
            prefix: /mfe/aad
      route:
        - destination:
            host: aad-fe-nginx-view
    - name: data-engine
      match:
        - uri:
            prefix: /mfe/data-engine
      route:
        - destination:
            host: data-engine-nginx-view
    - name: mfe-shell
      match:
        - uri:
            prefix: /
      route:
        - destination:
            host: mfe-shell-nginx-view
